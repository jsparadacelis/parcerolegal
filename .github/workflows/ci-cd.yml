name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        run: pytest backend/tests/ -v
        env:
          GROQ_API_KEY: ""
          QDRANT_URL: ""
          QDRANT_API_KEY: ""
          ENVIRONMENT: testing

  data-tests:
    name: Tests pipeline de datos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data/requirements.txt

      - name: Install dependencies
        run: pip install -r data/requirements.txt

      - name: Run tests
        run: pytest data/tests/ -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # Railway auto-deploys from GitHub push via its native GitHub integration.
  # No explicit deploy step needed here.
